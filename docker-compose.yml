# Runs the API and the UI together:
#   docker compose up --build
# UI:  http://localhost:8080   (nginx; forwards /api and /health to the API)
# API: http://localhost:5080   (direct access, e.g. for curl)

services:
  api:
    build:
      context: .
      dockerfile: src/CashRegister.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "5080:8080"
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
